# Actualiza los datos cada mañana. Cloudflare Pages publica la web sola al ver el cambio.
name: Actualizar datos
on:
  schedule:
    # GitHub retrasa a veces las tareas programadas (hasta una hora), así que se lanza varias veces:
    # si no hay nada nuevo, no hace commit. Horas en UTC (Madrid = UTC+1 en invierno, UTC+2 en verano).
    - cron: "7 5 * * *"     # 06:07 Madrid (invierno)
    - cron: "37 6 * * *"    # 07:37
    - cron: "17 9 * * *"    # 10:17 (IPC, BCE y FRED publican a media mañana)
    - cron: "47 13 * * *"   # 14:47
    - cron: "37 19 * * *"   # 20:37: precios de la luz de mañana (REE publica hacia las 20:15)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 actualizar_datos.py
      - name: Guardar cambios
        run: |
          git config user.name "Remedios (bot)"
          git config user.email "actions@users.noreply.github.com"
          git add data.js
          git diff --cached --quiet || git commit -m "Datos del $(date +%F)"
          git pull --rebase origin main || true
          git push
