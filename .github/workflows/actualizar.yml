# Actualiza los datos cada mañana. Cloudflare Pages publica la web sola al ver el cambio.
name: Actualizar datos
on:
  schedule:
    - cron: "20 6 * * *"   # 07:20 en Madrid en invierno (08:20 en verano)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 actualizar_datos.py
      - name: Guardar cambios
        run: |
          git config user.name "Remedios (bot)"
          git config user.email "actions@users.noreply.github.com"
          git add data.js ine_series.json 2>/dev/null || git add data.js
          git diff --cached --quiet || git commit -m "Datos del $(date +%F)"
          git push
