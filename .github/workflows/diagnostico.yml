# Diagnóstico manual: no cambia nada, solo imprime información.
name: Diagnostico
on:
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 diag/diag_ine.py
